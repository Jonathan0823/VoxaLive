[workspace]
resolver = "2"
members = [
  "apps/backend",
  "crates/core",
  "crates/protocol",
  "crates/config",
  "crates/providers"
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"